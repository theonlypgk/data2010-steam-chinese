# Runs the notebook from scratch on a clean machine (download -> clean -> tables -> checks)
# and commits the output tables if they changed. Also a reproducibility check: anyone can
# re-run it from the Actions tab ("Run workflow").
name: pipeline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["steam_chinese_analysis.ipynb", "requirements.txt", ".github/workflows/pipeline.yml"]
permissions:
  contents: write
concurrency:
  group: pipeline
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Run the notebook from scratch
        run: jupyter nbconvert --to notebook --execute steam_chinese_analysis.ipynb --output /tmp/executed.ipynb --ExecutePreprocessor.timeout=1800
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # .xlsx files are zip archives whose bytes change on every run even when the data
          # does not; commit only when a CSV actually changed.
          if git diff --quiet -- data/processed/csv && [ -z "$(git ls-files --others --exclude-standard data/processed)" ]; then
            git checkout -- data/processed
            echo "outputs unchanged"
          else
            git add data/processed
            git commit -m "data: rebuild pcd_ tables from the notebook [pipeline]"
            git push
          fi
