# Runs the data pipeline end to end on a clean machine and commits the outputs.
# This doubles as a reproducibility check: anyone can re-run it from the Actions tab.
name: pipeline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "src/**", "run.py", "requirements.txt", ".github/workflows/pipeline.yml"]
permissions:
  contents: write
concurrency:
  group: pipeline
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests
        run: python run.py test
      - name: Download and trim the pinned snapshots
        run: python run.py data
      - name: Clean and build the analysis tables
        run: python run.py tables
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/interim data/processed
          if git diff --cached --quiet; then
            echo "outputs unchanged"
          else
            git commit -m "data: rebuild trimmed snapshots and pcd_ tables [pipeline]"
            git push
          fi
