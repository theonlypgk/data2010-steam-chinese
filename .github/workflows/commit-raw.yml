# Puts the two pinned raw snapshots into data/raw/ of the repository, stored with Git LFS
# because each file is over GitHub's 100 MB file limit. Run from the Actions tab
# ("Run workflow"); the checksums must match the release raw-snapshots-v1.
name: commit-raw
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Download the pinned snapshots (same commits as the notebook)
        run: |
          base=https://huggingface.co/datasets/FronkonGames/steam-games-dataset/resolve
          curl -fsSL -o data/raw/games_a.csv "$base/52ba62abfa707a2fa31f4d147c2777a9d9fbd2da/games.csv"
          curl -fsSL -o data/raw/games_c.csv "$base/aefdeb1ff1a739b92ac5338682cc2610a0328505/games.csv"
      - name: Check against the release checksums
        run: |
          cd data/raw
          echo "1b48008b01a799d82385d6e66ba0cb65dd477b6aa4b6c2ec8c443025ab6880ad  games_a.csv" >  /tmp/sums
          echo "c755572b804a5c43f4f005aacef23cadfe92ae77d03daebf908d521c81285821  games_c.csv" >> /tmp/sums
          sha256sum -c /tmp/sums
      - name: Commit with Git LFS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install --local
          git add data/raw/games_a.csv data/raw/games_c.csv
          if git diff --cached --quiet; then echo "raw files already committed"; exit 0; fi
          git commit -m "data: add raw snapshots A and C to data/raw (Git LFS)"
          git pull --rebase origin main
          git push origin HEAD:main
